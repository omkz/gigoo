# Render Blueprint for the Gigoo WebMCP hackathon demo.
#
# One web service + one PostgreSQL database, both in Singapore. Puma runs
# single-process/multi-threaded (config/puma.rb has no `workers` directive),
# so RAILS_MAX_THREADS is the only concurrency knob that matters here -- kept
# conservative for a small demo instance.
databases:
  - name: gigoo-db
    region: singapore
    plan: free

services:
  - type: web
    name: gigoo
    runtime: ruby
    region: singapore
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bin/rails server
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gigoo-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_MAX_THREADS
        value: "3"
